<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a141e">
<title>거짓말 극장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#f4ead5; --paper-2:#ebdcbc; --paper-3:#fffaf0;
  --ink:#2b1d14; --ink-soft:#6a5440; --line:#cdb284;
  --wine:#7a1f2b; --wine-dark:#4e1119; --gold:#a8834a; --gold-light:#e2c88f;
  --liar:#8a2232; --troll:#3e5c3a; --aud:#2f4a6b;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#f4ead5}
body,h1,h2,h3,p,div{word-break:keep-all;overflow-wrap:break-word}
body{
  min-height:100vh; color:var(--ink); background:var(--paper);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(255,250,235,.9), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(120,80,40,.25), transparent 60%),
    repeating-linear-gradient(0deg, rgba(120,90,50,.025) 0 2px, transparent 2px 4px);
  font-family:'Gowun Batang', 'Nanum Myeongjo', serif; font-size:16px; line-height:1.6;
  -webkit-tap-highlight-color: transparent;
}
/* 커튼 띠 */
.curtain{
  height:34px; background:
    radial-gradient(circle at 12px -4px, transparent 13px, var(--wine) 14px) 0 0/24px 34px repeat-x;
  filter: drop-shadow(0 3px 2px rgba(60,10,15,.35));
}
.curtain-top{height:14px;background:linear-gradient(var(--wine-dark),var(--wine));border-bottom:2px solid var(--gold)}
.wrap{max-width:480px;margin:0 auto;padding:8px 16px 48px}
h1,h2,h3,.display{font-family:'Song Myung','Gowun Batang',serif;font-weight:400;margin:0}
.brand{text-align:center;margin:18px 0 22px}
.brand h1{font-size:44px;letter-spacing:.08em;color:var(--wine-dark);text-shadow:0 1px 0 #fff8e6}
.brand .sub{font-style:italic;color:var(--ink-soft);letter-spacing:.3em;font-size:13px;margin-top:2px}
.orn{color:var(--gold);text-align:center;letter-spacing:.6em;font-size:14px;margin:6px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 12px;font-size:14px;color:var(--ink-soft)}
.topbar .name{font-family:'Song Myung',serif;font-size:20px;color:var(--wine-dark)}
.badge{border:1px solid var(--gold);padding:2px 10px;border-radius:2px;background:var(--paper-3);letter-spacing:.15em}

.card{
  position:relative;background:linear-gradient(var(--paper-3),#f8efdb);
  border:1px solid var(--gold); outline:3px double var(--line); outline-offset:3px;
  padding:20px 18px;margin:18px 4px;box-shadow:0 6px 18px rgba(80,50,20,.15);
}
.card::before,.card::after{content:'✦';position:absolute;color:var(--gold);font-size:12px;line-height:1}
.card::before{top:4px;left:6px}.card::after{bottom:4px;right:6px}
.card h2{font-size:22px;color:var(--wine-dark);text-align:center;margin-bottom:10px}
.card h3{font-size:18px;color:var(--wine-dark);margin-bottom:6px}
.muted{color:var(--ink-soft);font-size:14px}
.center{text-align:center}
.rule{border:0;border-top:1px solid var(--line);margin:18px 0;position:relative;overflow:visible}
.rule::after{content:'❦';position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:var(--paper-3);padding:0 8px;color:var(--gold)}

label{display:block;font-size:14px;color:var(--ink-soft);margin:10px 0 4px}
input[type=text],input[type=number],input[type=tel]{
  width:100%;font:inherit;font-size:18px;padding:11px 12px;color:var(--ink);
  background:#fffdf7;border:1px solid var(--line);border-bottom:2px solid var(--gold);border-radius:2px;outline:none;
}
input:focus{border-color:var(--wine);box-shadow:0 0 0 3px rgba(122,31,43,.12)}
input.code{text-align:center;letter-spacing:.5em;font-size:26px;font-family:'Song Myung',serif}

.btn{
  display:block;width:100%;font:inherit;font-size:18px;letter-spacing:.12em;cursor:pointer;
  padding:13px 14px;margin-top:12px;border-radius:2px;
  color:#fbf2dc;background:linear-gradient(var(--wine),var(--wine-dark));
  border:1px solid var(--gold);box-shadow:inset 0 0 0 2px rgba(226,200,143,.35),0 3px 8px rgba(60,10,15,.25);
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{color:var(--wine-dark);background:transparent;box-shadow:none;border:1px solid var(--gold)}
.btn.small{font-size:14px;padding:8px 10px;width:auto;display:inline-block;margin:0}
.row{display:flex;gap:10px}.row>*{flex:1}

.plist{list-style:none;padding:0;margin:8px 0 0}
.plist li{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px dotted var(--line)}
.plist li:last-child{border-bottom:0}
.plist .who{font-size:17px}
.plist .x{background:none;border:0;color:var(--ink-soft);font-size:18px;cursor:pointer;padding:0 6px}
.crown{color:var(--gold);margin-left:4px}
.done{color:var(--troll)} .wait{color:var(--ink-soft)}

.bigcode{font-family:'Song Myung',serif;font-size:54px;letter-spacing:.35em;text-align:center;color:var(--wine-dark);padding-left:.35em}

.role{text-align:center;padding:24px 16px}
.role .icon{font-size:46px;line-height:1}
.role .rname{font-family:'Song Myung',serif;font-size:38px;margin:6px 0 4px}
.role.liar{border-color:var(--liar)} .role.liar .rname{color:var(--liar)}
.role.troll{border-color:var(--troll)} .role.troll .rname{color:var(--troll)}
.role.audience .rname{color:var(--aud)}

.topic{font-family:'Song Myung',serif;font-size:26px;text-align:center;color:var(--ink);line-height:1.35}
.topic.hidden{color:var(--liar);letter-spacing:.4em}
.range{text-align:center;margin-top:10px;font-size:17px}
.range b{font-size:22px;color:var(--wine-dark)}

.mynum{font-family:'Song Myung',serif;font-size:120px;line-height:1;text-align:center;color:var(--wine-dark);margin:10px 0 0;text-shadow:0 2px 0 #fff4dc}
.myname{text-align:center;font-family:'Song Myung',serif;font-size:28px}
.peek{font-size:14px;margin-top:14px}
.peekbox{margin-top:10px;text-align:center;font-size:18px}

.reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{border:1px solid var(--gold);background:#fffdf6;padding:12px 8px;text-align:center}
.rcard .n{font-family:'Song Myung',serif;font-size:40px;line-height:1.1;color:var(--wine-dark)}
.rcard .nm{font-size:16px}
.rcard .rl{display:inline-block;margin-top:6px;padding:1px 10px;font-size:14px;color:#fbf2dc;border-radius:2px}
.rl.liar{background:var(--liar)} .rl.troll{background:var(--troll)} .rl.audience{background:var(--aud)}
.pick{display:block;width:100%;margin-top:8px;font:inherit;font-size:15px;padding:8px;cursor:pointer;
  background:transparent;border:1px solid var(--wine);color:var(--wine-dark);border-radius:2px}
.rcard.accused{outline:3px solid var(--wine);outline-offset:2px}

.winner{text-align:center;padding:26px 16px}
.winner .crown-big{font-size:40px;color:var(--gold)}
.winner .wt{font-family:'Song Myung',serif;font-size:32px;line-height:1.3;color:var(--wine-dark);margin:4px 0}
.score{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dotted var(--line);font-size:17px}
.score b{font-family:'Song Myung',serif;font-size:20px;color:var(--wine-dark)}

details.topics summary{cursor:pointer;font-family:'Song Myung',serif;font-size:18px;color:var(--wine-dark);list-style:none;text-align:center}
details.topics summary::-webkit-details-marker{display:none}
.tlist{list-style:none;padding:0;margin:10px 0 0;font-size:15px}
.tlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dotted var(--line)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90%;
  background:var(--wine-dark);color:#fbf2dc;border:1px solid var(--gold);padding:10px 18px;font-size:15px;
  box-shadow:0 6px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;text-align:center}
.toast.show{opacity:1}
.hint{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:10px}
.foot{text-align:center;margin-top:24px}
code{background:#efe3c6;padding:1px 5px}
</style>
</head>

<script>
/* ===========================================================
   ① Firebase 설정값 — Firebase 콘솔에서 복사한 값으로 바꿔 넣으세요
   =========================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAisD60ZpnIC1p3cQVura7Pwf2f6XwANRE",
  authDomain: "lie-hunt-for-family.firebaseapp.com",
  databaseURL: "https://lie-hunt-for-family-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lie-hunt-for-family",
  storageBucket: "lie-hunt-for-family.firebasestorage.app",
  messagingSenderId: "726326035245",
  appId: "1:726326035245:web:6b253fdcef04dd5c1349a4"
};

/* ===========================================================
   ② 기본 주제 카드 (주제, 단위, 최소, 최대)
   =========================================================== */
const BUILTIN_TOPICS = [
  ["하루 평균 수면 시간","시간",0,24],
  ["아침에 일어나서 집을 나서기까지 걸리는 시간","분",0,120],
  ["양치하는 데 걸리는 시간","분",0,10],
  ["샤워하는 데 걸리는 시간","분",0,60],
  ["머리 감는 데 걸리는 시간","분",0,30],
  ["하루에 마시는 물의 양","컵",0,20],
  ["일주일에 라면 먹는 횟수","번",0,14],
  ["일주일에 간식 먹는 횟수","번",0,50],
  ["한 번에 먹을 수 있는 만두 개수","개",0,50],
  ["한 번에 먹을 수 있는 귤 개수","개",0,30],
  ["한 번에 먹을 수 있는 아이스크림 개수","개",0,10],
  ["한 끼에 먹는 밥 공기 수","공기",0,5],
  ["매운 음식 자신감 점수","점",0,10],
  ["가지고 있는 신발 켤레 수","켤레",0,30],
  ["가지고 있는 인형 개수","개",0,50],
  ["지금까지 받은 상장 개수","장",0,50],
  ["지금까지 이사한 횟수","번",0,20],
  ["지금까지 가 본 나라 수","개국",0,30],
  ["지금까지 놀이공원에 가 본 횟수","번",0,50],
  ["1년에 영화관에 가는 횟수","번",0,50],
  ["하루에 TV·휴대폰을 보는 시간","시간",0,12],
  ["하루에 게임하는 시간","분",0,300],
  ["일주일에 책 읽는 시간","시간",0,30],
  ["일주일에 운동하는 날","일",0,7],
  ["줄넘기를 쉬지 않고 할 수 있는 개수","개",0,300],
  ["숨을 참을 수 있는 시간","초",0,120],
  ["계단으로 쉬지 않고 올라갈 수 있는 층수","층",0,50],
  ["지금까지 가장 오래 걸어 본 거리","km",0,50],
  ["외우고 있는 전화번호 개수","개",0,20],
  ["친한 친구 수","명",0,30],
  ["하루에 웃는 횟수","번",0,100],
  ["하루에 거울을 보는 횟수","번",0,50],
  ["하루에 손을 씻는 횟수","번",0,30],
  ["하루에 \"배고파\"라고 말하는 횟수","번",0,30],
  ["이번 달에 들은 칭찬 횟수","번",0,100],
  ["알람이 울린 뒤 실제로 일어나기까지 걸리는 시간","분",0,60],
  ["화가 났을 때 마음이 풀리기까지 걸리는 시간","분",0,180],
  ["기억나는 가장 어렸을 때의 나이","살",0,10],
  ["스스로 매기는 노래 실력 점수","점",0,100],
  ["스스로 매기는 요리 실력 점수","점",0,100],
  ["생일 선물로 받고 싶은 물건의 가격","만 원",0,100],
  ["1년에 수영장이나 바다에 가는 횟수","번",0,50]
];

const MIN_PLAYERS = 4, MAX_PLAYERS = 6;
const ROLES = {
  liar:     {name:"라이어", icon:"🎭", goal:"주제를 모른 채 숫자를 적어요. 끝까지 들키지 않으면 승리!"},
  troll:    {name:"트롤",   icon:"🃏", goal:"주제를 알고 있어요. 모두가 나를 라이어로 지목하게 만들면 승리!"},
  audience: {name:"관객",   icon:"🎩", goal:"주제를 알고 있어요. 숨어 있는 라이어를 찾아 지목하면 승리!"}
};
const WIN = {
  audience:   {title:"관객의 승리", desc:"라이어의 정체가 밝혀졌습니다!"},
  liar_troll: {title:"라이어와 트롤의 승리", desc:"트롤의 연기에 모두 속았습니다!"},
  liar:       {title:"라이어의 승리", desc:"엉뚱한 관객이 지목되었습니다!"}
};

/* ---------- 유틸 ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let myId = store('lh_pid');
if(!myId){ myId = 'p' + Math.random().toString(36).slice(2,10); store('lh_pid', myId); }
let myName = store('lh_name') || '';
let roomCode = null, room = null, roomRef = null, peek = false;

const configured = !!firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes('여기에');
let db = null;
if(configured && window.firebase){ firebase.initializeApp(firebaseConfig); db = firebase.database(); }

/* ---------- 직접 추가한 주제 (호스트 기기에 저장) ---------- */
function getCustom(){ try{ return JSON.parse(store('lh_custom') || '[]'); }catch(e){ return []; } }
function setCustom(list){ store('lh_custom', JSON.stringify(list)); }

/* ---------- 방 관리 ---------- */
const isHost = () => room && room.host === myId;
const players = () => room && room.players ? room.players : {};
const nameOf = id => (players()[id] && players()[id].name) || '(나간 사람)';

async function createRoom(){
  const name = (document.getElementById('nameIn').value || '').trim();
  if(!name) return toast('닉네임을 먼저 적어 주세요');
  myName = name; store('lh_name', name);
  let code;
  for(let i=0;i<8;i++){
    code = String(Math.floor(1000 + Math.random()*9000));
    const s = await db.ref('rooms/'+code).get();
    if(!s.exists()) break;
  }
  await db.ref('rooms/'+code).set({
    host: myId, phase: 'lobby', round: 0, createdAt: Date.now(),
    players: { [myId]: { name, joinedAt: Date.now(), score: 0 } }
  });
  enterRoom(code);
}

async function joinRoom(codeArg){
  const name = (document.getElementById('nameIn')?.value || myName || '').trim();
  const code = (codeArg || document.getElementById('codeIn').value || '').trim();
  if(!name) return toast('닉네임을 먼저 적어 주세요');
  if(!/^\d{4}$/.test(code)) return toast('입장 코드 4자리를 적어 주세요');
  myName = name; store('lh_name', name);
  const s = await db.ref('rooms/'+code).get();
  if(!s.exists()) return toast('그런 방이 없어요. 코드를 다시 확인해 주세요');
  const r = s.val(); const ps = r.players || {};
  if(ps[myId]){ await db.ref(`rooms/${code}/players/${myId}/name`).set(name); return enterRoom(code); }
  if(!['lobby','result'].includes(r.phase)) return toast('게임이 진행 중이에요. 이번 판이 끝나면 들어와 주세요');
  if(Object.keys(ps).length >= MAX_PLAYERS) return toast(`방이 가득 찼어요 (최대 ${MAX_PLAYERS}명)`);
  if(Object.values(ps).some(p => p.name === name)) return toast('같은 닉네임이 이미 있어요');
  await db.ref(`rooms/${code}/players/${myId}`).set({ name, joinedAt: Date.now(), score: 0 });
  enterRoom(code);
}

function enterRoom(code){
  if(roomRef) roomRef.off();
  roomCode = code; store('lh_room', code); peek = false;
  roomRef = db.ref('rooms/'+code);
  roomRef.on('value', snap => {
    room = snap.val();
    if(!room){ leaveLocal(); toast('방이 닫혔어요'); return; }
    if(!room.players || !room.players[myId]){ leaveLocal(); toast('방에서 나왔어요'); return; }
    hostAutoAdvance();
    render();
  });
}

function leaveLocal(){
  if(roomRef) roomRef.off();
  roomRef = null; room = null; roomCode = null; store('lh_room', null);
  history.replaceState(null, '', location.pathname);
  render();
}

async function leaveRoom(){
  if(isHost()){
    if(!confirm('호스트가 나가면 방이 닫혀요. 나갈까요?')) return;
    await db.ref('rooms/'+roomCode).remove();
  } else {
    if(!confirm('방에서 나갈까요?')) return;
    await db.ref(`rooms/${roomCode}/players/${myId}`).remove();
  }
}

/* ---------- 게임 진행 (호스트) ---------- */
function pickTopic(){
  const pool = BUILTIN_TOPICS.map(t => ({text:t[0],unit:t[1],min:t[2],max:t[3]})).concat(getCustom());
  const recent = room.recent || [];
  let cands = pool.filter(t => !recent.includes(t.text));
  if(!cands.length) cands = pool;
  return cands[Math.floor(Math.random()*cands.length)];
}

async function startGame(){
  const ids = Object.keys(players());
  if(ids.length < MIN_PLAYERS || ids.length > MAX_PLAYERS) return toast(`${MIN_PLAYERS}~${MAX_PLAYERS}명이 모여야 시작할 수 있어요`);
  const order = shuffle(ids);
  const roles = {};
  order.forEach((id, i) => roles[id] = i === 0 ? 'liar' : i === 1 ? 'troll' : 'audience');
  const t = pickTopic();
  const recent = [t.text].concat(room.recent || []).slice(0, 15);
  await roomRef.update({
    phase: 'input', round: (room.round || 0) + 1, recent,
    game: { topic: t.text, unit: t.unit || '', min: Number(t.min), max: Number(t.max), roles }
  });
}

function hostAutoAdvance(){
  if(!isHost() || room.phase !== 'input' || !room.game) return;
  const ids = Object.keys(room.game.roles || {}).filter(id => players()[id]);
  const nums = room.game.numbers || {};
  if(ids.length && ids.every(id => nums[id] !== undefined)) roomRef.update({ phase: 'discuss' });
}

async function forceDiscuss(){
  if(!confirm('아직 입력하지 않은 사람이 있어요. 그래도 주제를 공개할까요?')) return;
  await roomRef.update({ phase: 'discuss' });
}

async function revealRoles(){
  if(!confirm('지목을 마쳤나요? 모두의 역할을 공개합니다.')) return;
  await roomRef.update({ phase: 'reveal' });
}

async function chooseAccused(pid){
  const role = room.game.roles[pid];
  if(!confirm(`가장 많이 지목된 사람이 "${nameOf(pid)}" 님이 맞나요?`)) return;
  const winner = role === 'liar' ? 'audience' : role === 'troll' ? 'liar_troll' : 'liar';
  const upd = { phase: 'result', 'game/accused': pid, 'game/winner': winner };
  Object.entries(room.game.roles).forEach(([id, r]) => {
    if(!players()[id]) return;
    const won = winner === 'audience' ? r === 'audience' : winner === 'liar_troll' ? (r === 'liar' || r === 'troll') : r === 'liar';
    if(won) upd[`players/${id}/score`] = (players()[id].score || 0) + 1;
  });
  await roomRef.update(upd);
}

async function toLobby(){ await roomRef.update({ phase: 'lobby', game: null }); }

async function submitNumber(){
  const g = room.game; const el = document.getElementById('numIn');
  const raw = (el.value || '').trim();
  const v = Number(raw);
  if(raw === '' || !Number.isInteger(v)) return toast('정수로 적어 주세요');
  if(v < g.min || v > g.max) return toast(`${g.min} ~ ${g.max} 사이의 숫자만 쓸 수 있어요`);
  await db.ref(`rooms/${roomCode}/game/numbers/${myId}`).set(v);
}

/* ---------- 화면 그리기 ---------- */
function render(){
  // 입력 중이던 내용과 커서를 보존
  const keep = {}; let focusId = null;
  $app.querySelectorAll('input[id]').forEach(i => keep[i.id] = i.value);
  if(document.activeElement && document.activeElement.id) focusId = document.activeElement.id;

  if(!configured) $app.innerHTML = viewSetup();
  else if(!room) $app.innerHTML = viewHome();
  else $app.innerHTML = viewTop() + ({lobby:viewLobby, input:viewInput, discuss:viewDiscuss, reveal:viewReveal, result:viewResult}[room.phase] || viewLobby)();

  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if(el && !el.dataset.fresh) el.value = v; });
  if(focusId){ const el = document.getElementById(focusId); if(el) el.focus(); }
}

const brand = () => `<div class="brand"><h1>거짓말 극장</h1><div class="sub">THEATRE OF LIES</div><div class="orn">✦ ❧ ✦</div></div>`;

function viewSetup(){
  return brand() + `<section class="card"><h2>무대 준비가 필요합니다</h2>
    <p>이 파일의 <code>firebaseConfig</code> 부분에 Firebase 설정값을 넣어야 여러 사람이 함께 접속할 수 있어요.</p>
    <p class="muted">설정 방법은 함께 받은 안내를 참고해 주세요.</p></section>`;
}

function viewHome(){
  const urlCode = new URLSearchParams(location.search).get('room') || '';
  return brand() + `
  <section class="card">
    <h2>입장권</h2>
    <label for="nameIn">닉네임</label>
    <input id="nameIn" type="text" maxlength="10" placeholder="예) 셜록" value="${esc(myName)}">
    <hr class="rule">
    <h3 class="center">새 무대 열기</h3>
    <p class="muted center">내 휴대폰이 호스트가 되어 방을 만들어요.</p>
    <button class="btn" data-act="create">방 만들기</button>
    <hr class="rule">
    <h3 class="center">무대에 입장하기</h3>
    <label for="codeIn">입장 코드 4자리</label>
    <input id="codeIn" class="code" type="tel" inputmode="numeric" maxlength="4" placeholder="0000" value="${esc(urlCode)}">
    <button class="btn ghost" data-act="join">입장하기</button>
  </section>
  <section class="card"><h3 class="center">극장의 규칙</h3>
    <p class="muted">${ROLES.liar.icon} <b>라이어</b> 1명은 주제를 모른 채 숫자를 적고, ${ROLES.troll.icon} <b>트롤</b> 1명은 일부러 의심받으려 하며, ${ROLES.audience.icon} <b>관객</b>은 라이어를 찾아냅니다.
    숫자를 보여 주며 이야기를 나눈 뒤, 셋·둘·하나에 동시에 라이어를 지목하세요. 동점이면 다시 지목합니다.</p>
  </section>`;
}

function viewTop(){
  return `<div class="topbar"><span class="name">거짓말 극장</span>
    <span>${room.round ? `제${room.round}막 · ` : ''}<span class="badge">${esc(roomCode)}</span></span></div>`;
}

function playerList(opts = {}){
  const ps = players();
  const ids = Object.keys(ps).sort((a,b) => (ps[a].joinedAt||0) - (ps[b].joinedAt||0));
  return `<ul class="plist">` + ids.map(id => {
    let right = '';
    if(opts.status){ const done = opts.status(id); right = done === null ? '<span class="wait">관람</span>' : done ? '<span class="done">✓ 제출</span>' : '<span class="wait">작성 중…</span>'; }
    else if(isHost() && id !== myId) right = `<button class="x" data-act="kick" data-id="${id}" aria-label="내보내기">✕</button>`;
    return `<li><span class="who">${esc(ps[id].name)}${id === room.host ? '<span class="crown">♛</span>' : ''}${id === myId ? ' <span class="muted">(나)</span>' : ''}</span>${right}</li>`;
  }).join('') + `</ul>`;
}

function viewLobby(){
  const n = Object.keys(players()).length;
  const canStart = n >= MIN_PLAYERS && n <= MAX_PLAYERS;
  let html = `
  <section class="card"><h2>입장 코드</h2>
    <div class="bigcode">${esc(roomCode)}</div>
    <p class="muted center">같은 주소로 들어와 이 코드를 입력하면 입장할 수 있어요.</p>
    <button class="btn ghost small" style="display:block;margin:8px auto 0" data-act="copy">초대 링크 복사</button>
  </section>
  <section class="card"><h2>출연진 (${n}/${MAX_PLAYERS})</h2>${playerList()}</section>`;
  if(isHost()){
    html += `<button class="btn" data-act="start" ${canStart ? '' : 'disabled'}>공연 시작</button>
      ${canStart ? '' : `<p class="hint">${MIN_PLAYERS}~${MAX_PLAYERS}명이 모이면 시작할 수 있어요.</p>`}
      ${viewTopicManager()}`;
  } else {
    html += `<p class="hint">호스트가 공연을 시작하기를 기다리는 중…</p>`;
  }
  return html + `<div class="foot"><button class="btn ghost small" data-act="leave">나가기</button></div>`;
}

function viewTopicManager(){
  const list = getCustom();
  return `<section class="card"><details class="topics"><summary>✎ 주제 카드 직접 추가하기 (${list.length})</summary>
    <p class="muted">기본 주제 ${BUILTIN_TOPICS.length}개에 더해, 여기서 추가한 주제도 무작위로 나와요. 이 휴대폰에 저장됩니다.</p>
    <label for="tText">주제</label><input id="tText" type="text" maxlength="40" placeholder="예) 하루에 하품하는 횟수">
    <label for="tUnit">단위</label><input id="tUnit" type="text" maxlength="6" placeholder="예) 번">
    <div class="row"><div><label for="tMin">최소</label><input id="tMin" type="number" inputmode="numeric" placeholder="0"></div>
    <div><label for="tMax">최대</label><input id="tMax" type="number" inputmode="numeric" placeholder="30"></div></div>
    <button class="btn ghost" data-act="addTopic">주제 추가</button>
    <ul class="tlist">${list.map((t,i) => `<li><span>${esc(t.text)} <span class="muted">(${t.min}~${t.max}${esc(t.unit)})</span></span><button class="x" data-act="delTopic" data-id="${i}">✕</button></li>`).join('')}</ul>
  </details></section>`;
}

function myRoleCard(){
  const r = room.game.roles[myId]; const R = ROLES[r];
  return `<section class="card role ${r}"><div class="muted">당신의 배역</div><div class="icon">${R.icon}</div><div class="rname">${R.name}</div><div class="muted">${R.goal}</div></section>`;
}

function viewInput(){
  const g = room.game;
  if(!g.roles[myId]) return `<section class="card center"><h2>이번 막은 관람 중</h2><p class="muted">다음 판부터 함께할 수 있어요.</p></section>`;
  const role = g.roles[myId];
  const nums = g.numbers || {};
  const mine = nums[myId];
  const ids = Object.keys(g.roles).filter(id => players()[id]);
  const doneCnt = ids.filter(id => nums[id] !== undefined).length;
  let html = myRoleCard() + `<section class="card"><div class="muted center">이번 막의 주제</div>
    ${role === 'liar' ? `<div class="topic hidden">？？？</div><p class="muted center">라이어는 주제를 볼 수 없어요. 범위 안에서 그럴듯한 숫자를 적으세요.</p>` : `<div class="topic">${esc(g.topic)}</div>`}
    <div class="range">범위 <b>${g.min}</b> ~ <b>${g.max}</b> ${esc(g.unit)}</div>`;
  if(mine === undefined){
    html += `<label for="numIn">나의 숫자</label><input id="numIn" class="code" style="letter-spacing:.1em" type="number" inputmode="numeric" min="${g.min}" max="${g.max}" placeholder="?">
      <button class="btn" data-act="submit">제출하기</button>`;
  } else {
    html += `<div class="mynum" style="font-size:72px">${mine}</div><p class="hint">제출 완료! 다른 출연진을 기다리는 중… (${doneCnt}/${ids.length})</p>`;
  }
  html += `</section><section class="card"><h3 class="center">제출 현황</h3>${playerList({status: id => g.roles[id] ? nums[id] !== undefined : null})}</section>`;
  if(isHost()) html += `<div class="foot"><button class="btn ghost small" data-act="force">입력 기다리지 않고 주제 공개</button></div>`;
  return html;
}

function viewDiscuss(){
  const g = room.game;
  if(!g.roles[myId]) return `<section class="card center"><h2>토론 중</h2><div class="topic">${esc(g.topic)}</div></section>`;
  const mine = (g.numbers || {})[myId];
  const r = g.roles[myId];
  let html = `<section class="card"><div class="muted center">이번 막의 주제</div><div class="topic">${esc(g.topic)}</div>
    <div class="range">${g.min} ~ ${g.max} ${esc(g.unit)}</div></section>
  <section class="card"><div class="myname">${esc(myName)}</div>
    <div class="mynum">${mine === undefined ? '–' : mine}</div>
    <div class="center muted">${esc(g.unit)}</div>
    <div class="center"><button class="btn ghost small peek" data-act="peek">${peek ? '역할 가리기' : '내 역할 몰래 보기'}</button></div>
    ${peek ? `<div class="peekbox">${ROLES[r].icon} <b>${ROLES[r].name}</b></div>` : ''}
  </section>
  <p class="hint">화면을 서로 보여 주며 왜 이 숫자를 적었는지 이야기해 보세요.<br>충분히 이야기했다면 셋·둘·하나에 동시에 라이어를 지목! 동점이면 다시 지목합니다.</p>`;
  if(isHost()) html += `<button class="btn" data-act="reveal">결과 공개</button>`;
  else html += `<p class="hint">지목이 끝나면 호스트가 결과를 공개해요.</p>`;
  return html;
}

function resultGrid(showPick){
  const g = room.game; const nums = g.numbers || {};
  return `<div class="reveal-grid">` + Object.keys(g.roles).filter(id => players()[id]).map(id => {
    const r = g.roles[id];
    return `<div class="rcard ${g.accused === id ? 'accused' : ''}"><div class="nm">${esc(nameOf(id))}</div>
      <div class="n">${nums[id] === undefined ? '–' : nums[id]}</div>
      <span class="rl ${r}">${ROLES[r].icon} ${ROLES[r].name}</span>
      ${showPick ? `<button class="pick" data-act="accuse" data-id="${id}">이 사람이 지목됨</button>` : ''}</div>`;
  }).join('') + `</div>`;
}

function viewReveal(){
  const g = room.game;
  return `<section class="card"><h2>정체 공개</h2><div class="topic" style="font-size:20px">${esc(g.topic)}</div>
    <div class="range" style="margin-bottom:14px">${g.min} ~ ${g.max} ${esc(g.unit)}</div>
    ${resultGrid(isHost())}
    <p class="hint">${isHost() ? '가장 많이 지목된 사람을 눌러 주세요. 동점이었다면 다시 지목한 결과를 누르세요.' : '호스트가 지목 결과를 입력하는 중…'}</p></section>`;
}

function viewResult(){
  const g = room.game; const W = WIN[g.winner] || WIN.audience;
  const ps = players();
  const board = Object.keys(ps).sort((a,b) => (ps[b].score||0) - (ps[a].score||0));
  let html = `<section class="card winner"><div class="crown-big">♛</div><div class="wt">${W.title}</div>
    <div class="muted">${W.desc}</div>
    <p>지목된 사람: <b>${esc(nameOf(g.accused))}</b> (${ROLES[g.roles[g.accused]].name})</p></section>
  <section class="card"><h3 class="center">이번 막의 배역</h3>${resultGrid(false)}</section>
  <section class="card"><h3 class="center">누적 승리</h3>${board.map(id => `<div class="score"><span>${esc(ps[id].name)}${id===myId?' <span class="muted">(나)</span>':''}</span><b>${ps[id].score||0}승</b></div>`).join('')}</section>`;
  if(isHost()) html += `<button class="btn" data-act="start">새 게임</button><button class="btn ghost" data-act="lobby">대기실로 (출연진·주제 정리)</button>`;
  else html += `<p class="hint">호스트가 다음 막을 준비하는 중…</p>`;
  return html + `<div class="foot"><button class="btn ghost small" data-act="leave">나가기</button></div>`;
}

/* ---------- 이벤트 ---------- */
async function act(a, id){
  try{
    switch(a){
      case 'create': return await createRoom();
      case 'join': return await joinRoom();
      case 'start': return await startGame();
      case 'submit': return await submitNumber();
      case 'force': return await forceDiscuss();
      case 'reveal': return await revealRoles();
      case 'accuse': return await chooseAccused(id);
      case 'lobby': return await toLobby();
      case 'leave': return await leaveRoom();
      case 'peek': peek = !peek; return render();
      case 'kick':
        if(confirm(`${nameOf(id)} 님을 내보낼까요?`)) await db.ref(`rooms/${roomCode}/players/${id}`).remove();
        return;
      case 'copy': {
        const url = location.origin + location.pathname + '?room=' + roomCode;
        try{ await navigator.clipboard.writeText(url); toast('초대 링크를 복사했어요'); }
        catch(e){ prompt('이 링크를 복사해 보내세요', url); }
        return;
      }
      case 'addTopic': {
        const text = document.getElementById('tText').value.trim();
        const unit = document.getElementById('tUnit').value.trim();
        const min = Number(document.getElementById('tMin').value), max = Number(document.getElementById('tMax').value);
        const minRaw = document.getElementById('tMin').value, maxRaw = document.getElementById('tMax').value;
        if(!text) return toast('주제를 적어 주세요');
        if(minRaw === '' || maxRaw === '' || !Number.isInteger(min) || !Number.isInteger(max) || min >= max) return toast('최소·최대를 정수로, 최소 < 최대가 되게 적어 주세요');
        const list = getCustom(); list.push({text, unit, min, max}); setCustom(list);
        ['tText','tUnit','tMin','tMax'].forEach(k => document.getElementById(k).value = '');
        render(); document.querySelector('details.topics').open = true; toast('주제를 추가했어요');
        return;
      }
      case 'delTopic': {
        const list = getCustom(); list.splice(Number(id), 1); setCustom(list);
        render(); document.querySelector('details.topics').open = true; return;
      }
    }
  }catch(e){ console.error(e); toast('연결에 문제가 있어요. 잠시 후 다시 시도해 주세요'); }
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  act(b.dataset.act, b.dataset.id);
});
$app.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const id = e.target.id;
  if(id === 'numIn') act('submit');
  else if(id === 'codeIn') act('join');
});

/* ---------- 시작 ---------- */
render();
if(db){
  const saved = store('lh_room');
  if(saved){
    db.ref('rooms/'+saved).get().then(s => {
      if(s.exists() && s.val().players && s.val().players[myId]) enterRoom(saved);
      else store('lh_room', null);
    }).catch(()=>{});
  }
}
</script>
