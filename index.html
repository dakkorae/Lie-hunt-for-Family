<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f3">
<title>라이어 게임 for Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f3; --card:#ffffff; --ink:#111111; --ink-2:#3a3a3a; --soft:#8a8a8a;
  --line:#e6e6e4; --line-2:#d4d4d2; --chip:#f1f1f0; --mid:#5c5c5c;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#f4f4f3}
body,h1,h2,h3,p,div,li{word-break:keep-all;overflow-wrap:break-word}
body{
  min-height:100vh;color:var(--ink);background:var(--bg);
  font-family:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:480px;margin:0 auto;padding:12px 16px 56px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.brand{text-align:center;margin:44px 0 30px}
.brand h1{font-size:38px;line-height:1.15}
.brand h1 .for{display:block;font-size:15px;font-weight:700;letter-spacing:.32em;color:var(--soft);margin-top:10px;text-transform:uppercase}
.brand .sub{font-size:11px;letter-spacing:.42em;color:var(--soft);margin-top:14px}
.brand .bar{width:28px;height:2px;background:var(--ink);margin:18px auto 0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;font-size:13px;color:var(--soft)}
.topbar .name{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.topbar .name small{font-weight:700;color:var(--soft);margin-left:4px;letter-spacing:.1em}
.badge{background:var(--ink);color:#fff;padding:3px 10px;border-radius:999px;letter-spacing:.18em;font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin:14px 0;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.04)}
.card h2{font-size:20px;text-align:center;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:6px}
.muted{color:var(--soft);font-size:14px}
.center{text-align:center}
.rule{border:0;border-top:1px solid var(--line);margin:24px 0}

label{display:block;font-size:13px;font-weight:700;color:var(--mid);margin:12px 0 6px}
input[type=text],input[type=number],input[type=tel]{
  width:100%;font:inherit;font-size:17px;padding:13px 14px;color:var(--ink);
  background:#fafafa;border:1px solid var(--line-2);border-radius:12px;outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
input.code{text-align:center;letter-spacing:.5em;font-size:26px;font-weight:800;padding-left:.5em}

.btn{display:block;width:100%;font:inherit;font-size:16px;font-weight:800;letter-spacing:.02em;cursor:pointer;
  padding:15px 14px;margin-top:12px;border-radius:12px;color:#fff;background:var(--ink);border:1px solid var(--ink);transition:opacity .15s}
.btn:active{opacity:.8}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{color:var(--ink);background:#fff;border:1px solid var(--line-2)}
.btn.small{font-size:13px;padding:9px 14px;width:auto;display:inline-block;margin:0;border-radius:999px}
.row{display:flex;gap:10px}.row>*{flex:1}

.plist{list-style:none;padding:0;margin:4px 0 0}
.plist li{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .who{font-size:16px;font-weight:700}
.plist .x{background:none;border:0;color:var(--soft);font-size:16px;cursor:pointer;padding:0 6px}
.crown{font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.done{color:var(--ink);font-weight:700;font-size:14px} .wait{color:var(--soft);font-size:14px}

.bigcode{font-size:56px;font-weight:800;letter-spacing:.3em;text-align:center;padding-left:.3em;line-height:1.2}

.role{text-align:center;padding:28px 18px}
.role .icon{font-size:40px;line-height:1;filter:grayscale(1)}
.role .rname{font-size:34px;font-weight:800;margin:8px 0 6px;letter-spacing:-.02em}
.role.liar{background:var(--ink);color:#fff;border-color:var(--ink)} .role.liar .muted{color:#b5b5b5}
.role.troll{background:#3a3a3a;color:#fff;border-color:#3a3a3a} .role.troll .muted{color:#bdbdbd}

.topic{font-size:23px;font-weight:800;text-align:center;line-height:1.4;letter-spacing:-.02em;margin-top:4px}
.topic.hidden{letter-spacing:.3em;font-size:30px}
.range{text-align:center;margin-top:12px;font-size:15px;color:var(--mid)}
.range b{font-size:18px;color:var(--ink)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--soft);text-align:center;text-transform:uppercase}

.mynum{font-size:120px;font-weight:800;line-height:1;text-align:center;margin:12px 0 0;letter-spacing:-.04em}
.myname{text-align:center;font-size:24px;font-weight:800}
.peek{margin-top:16px}
.peekbox{margin-top:12px;text-align:center;font-size:17px}

.reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{border:1px solid var(--line);border-radius:14px;background:#fafafa;padding:14px 8px;text-align:center}
.rcard .n{font-size:38px;font-weight:800;line-height:1.15;letter-spacing:-.03em}
.rcard .nm{font-size:15px;font-weight:700}
.rcard .rl{display:inline-block;margin-top:6px;padding:2px 10px;font-size:12px;font-weight:800;border-radius:999px}
.rl.liar{background:var(--ink);color:#fff} .rl.troll{background:#5c5c5c;color:#fff} .rl.audience{background:#fff;color:var(--ink);border:1px solid var(--line-2)}
.pick{display:block;width:100%;margin-top:10px;font:inherit;font-size:13px;font-weight:700;padding:9px;cursor:pointer;
  background:#fff;border:1px solid var(--line-2);color:var(--ink);border-radius:10px}
.rcard.accused{border:2px solid var(--ink);background:#fff}

.winner{text-align:center;padding:30px 18px;background:var(--ink);color:#fff;border-color:var(--ink)}
.winner .muted{color:#bdbdbd}
.winner .wt{font-size:30px;font-weight:800;line-height:1.3;margin:6px 0;letter-spacing:-.02em}
.winner .eyebrow{color:#9a9a9a}
.score{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);font-size:16px}
.score:last-child{border-bottom:0}
.score b{font-size:17px}

details.topics summary{cursor:pointer;font-size:16px;font-weight:800;list-style:none;text-align:center}
details.topics summary::-webkit-details-marker{display:none}
.tlist{list-style:none;padding:0;margin:12px 0 0;font-size:14px}
.tlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}

.rules{margin:0;padding:0;list-style:none;font-size:14.5px;color:var(--ink-2)}
.rules li{display:flex;gap:10px;padding:7px 0}
.rules .num{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.sec{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--soft);margin:18px 0 6px}
.sec:first-of-type{margin-top:4px}
.roles-tbl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px;color:var(--ink-2)}
.roles-tbl b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90%;background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;text-align:center}
.toast.show{opacity:1}
.hint{font-size:14px;color:var(--soft);text-align:center;margin-top:12px}
.foot{text-align:center;margin-top:24px}
.qr{display:flex;justify-content:center;margin:4px 0 6px}
.qr img{width:200px;height:200px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px}
.btn.end{color:#b00020;border-color:#e8c4c9}
code{background:var(--chip);padding:1px 6px;border-radius:4px}
</style>
</head>

<script>
/* ===========================================================
   ① Firebase 설정값 — Firebase 콘솔에서 복사한 값으로 바꿔 넣으세요
   =========================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAisD60ZpnIC1p3cQVura7Pwf2f6XwANRE",
  authDomain: "lie-hunt-for-family.firebaseapp.com",

/* ===========================================================
   ② 기본 주제 카드 (주제, 단위, 최소, 최대)
   =========================================================== */
const BUILTIN_TOPICS = [
  ["하루에 방귀 뀌는 횟수","번",0,50],
  ["일주일 동안 코딱지 판 횟수","번",0,50],
  ["화장실에서 한 번에 머무는 시간","분",0,60],
  ["하루에 하품하는 횟수","번",0,100],
  ["샤워하면서 노래 부르는 시간","분",0,30],
  ["일주일 동안 자다가 침 흘린 날","일",0,7],
  ["한 달 동안 양말을 뒤집어 신은 횟수","번",0,30],
  ["\"5분만 더…\" 하고 더 잔 시간","분",0,120],
  ["하루에 냉장고 문 여는 횟수","번",0,50],
  ["하루에 \"배고파\"라고 말하는 횟수","번",0,50],
  ["하루에 \"왜?\"라고 묻는 횟수","번",0,100],
  ["하루에 잔소리 듣는 횟수","번",0,50],
  ["하루에 \"공부해\" 소리 듣는 횟수","번",0,30],
  ["일주일 동안 형제·자매(가족)와 투닥거린 횟수","번",0,50],
  ["오늘 몰래 먹은 간식 개수","개",0,20],
  ["밥 먹을 때 흘리는 밥알 개수","개",0,100],
  ["한 입에 넣을 수 있는 방울토마토 개수","개",0,30],
  ["한 번에 먹을 수 있는 치킨 조각 수","조각",0,30],
  ["한 번에 먹을 수 있는 라면 개수","개",0,10],
  ["견딜 수 있는 떡볶이 매운맛 단계","단계",0,10],
  ["무인도에 가져갈 과자 봉지 수","봉지",0,100],
  ["눈 안 깜빡이고 버틸 수 있는 시간","초",0,120],
  ["한 발로 서서 버틸 수 있는 시간","초",0,300],
  ["숨 참고 버틸 수 있는 시간","초",0,120],
  ["줄넘기 2단 뛰기 연속 개수","개",0,100],
  ["하루에 거울 보는 횟수","번",0,100],
  ["일주일 동안 거울 보고 혼자 웃은 횟수","번",0,50],
  ["방(책상)에 굴러다니는 연필·펜 개수","개",0,100],
  ["가지고 있는 양말 켤레 수","켤레",0,50],
  ["내 방이 지저분한 정도","점",0,100],
  ["오늘 내 기분 점수","점",0,100],
  ["학교(회사)에 가기 싫은 정도","점",0,100],
  ["우리 집에서 내 서열 (1등이 대장)","등",1,10],
  ["내가 사실 외계인일 확률","%",0,100],
  ["내가 사실 천재일 확률","%",0,100],
  ["공룡이랑 싸워서 이길 확률","%",0,100],
  ["로봇청소기보다 청소를 잘할 확률","%",0,100],
  ["좀비 세상에서 살아남을 수 있는 날","일",0,365],
  ["키우고 싶은 강아지 수","마리",0,100],
  ["한 달 용돈으로 받고 싶은 금액","만 원",0,100],
  ["복권 1등이 되면 가족에게 나눠 줄 비율","%",0,100],
  ["1년 동안 크고 싶은 키","cm",0,50],
  ["가장 오래 게임해 본 시간 (하루 기록)","시간",0,24],
  ["손톱 깎는 주기","일",0,60],
  ["가장 오래 울어 본 시간","분",0,120]
];

const MIN_PLAYERS = 3, MAX_PLAYERS = 6;
const ROLES = {
  liar:     {name:"라이어", icon:"🎭", goal:"주제를 모른 채 숫자를 적어요. 끝까지 들키지 않으면 승리!"},
  troll:    {name:"트롤",   icon:"🃏", goal:"주제를 알고 있어요. 모두가 나를 라이어로 지목하게 만들면 승리!"},
  audience: {name:"관객",   icon:"🎩", goal:"주제를 알고 있어요. 숨어 있는 라이어를 찾아 지목하면 승리!"}
};
const WIN = {
  audience:   {title:"관객의 승리", desc:"라이어의 정체가 밝혀졌습니다!"},
  liar_troll: {title:"라이어와 트롤의 승리", desc:"트롤의 연기에 모두 속았습니다!"},
  liar:       {title:"라이어의 승리", desc:"엉뚱한 관객이 지목되었습니다!"}
};

/* ---------- 유틸 ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let myId = store('lh_pid');
if(!myId){ myId = 'p' + Math.random().toString(36).slice(2,10); store('lh_pid', myId); }
let myName = store('lh_name') || '';
let roomCode = null, room = null, roomRef = null, peek = false;

const configured = !!firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes('여기에');
let db = null;
if(configured && window.firebase){ firebase.initializeApp(firebaseConfig); db = firebase.database(); }

/* ---------- 직접 추가한 주제 (호스트 기기에 저장) ---------- */
function getCustom(){ try{ return JSON.parse(store('lh_custom') || '[]'); }catch(e){ return []; } }
function setCustom(list){ store('lh_custom', JSON.stringify(list)); }

/* ---------- 방 관리 ---------- */
const isHost = () => room && room.host === myId;
const players = () => room && room.players ? room.players : {};
const nameOf = id => (players()[id] && players()[id].name) || '(나간 사람)';

async function createRoom(){
  const name = (document.getElementById('nameIn').value || '').trim();
  if(!name) return toast('닉네임을 먼저 적어 주세요');
  myName = name; store('lh_name', name);
  let code;
  for(let i=0;i<8;i++){
    code = String(Math.floor(1000 + Math.random()*9000));
    const s = await db.ref('rooms/'+code).get();
    if(!s.exists()) break;
  }
  await db.ref('rooms/'+code).set({
    host: myId, phase: 'lobby', round: 0, createdAt: Date.now(),
    joinToken: Math.random().toString(36).slice(2,10),
    players: { [myId]: { name, joinedAt: Date.now(), score: 0 } }
  });
  enterRoom(code);
}

async function joinRoom(codeArg, token){
  const name = (document.getElementById('nameIn')?.value || myName || '').trim();
  const code = (codeArg || document.getElementById('codeIn').value || '').trim();
  if(!name) return toast('닉네임을 먼저 적어 주세요');
  if(!/^\d{4}$/.test(code)) return toast('입장 코드 4자리를 적어 주세요');
  myName = name; store('lh_name', name);
  const s = await db.ref('rooms/'+code).get();
  if(!s.exists()) return toast(token ? '이미 끝난 게임의 QR이에요. 호스트에게 새 QR을 받아 주세요' : '그런 방이 없어요. 코드를 다시 확인해 주세요');
  const r = s.val(); const ps = r.players || {};
  if(token && r.joinToken !== token) return toast('이미 끝난 게임의 QR이에요. 호스트에게 새 QR을 받아 주세요');
  if(ps[myId]){ await db.ref(`rooms/${code}/players/${myId}/name`).set(name); return enterRoom(code); }
  if(!['lobby','result'].includes(r.phase)) return toast('게임이 진행 중이에요. 이번 판이 끝나면 들어와 주세요');
  if(Object.keys(ps).length >= MAX_PLAYERS) return toast(`방이 가득 찼어요 (최대 ${MAX_PLAYERS}명)`);
  if(Object.values(ps).some(p => p.name === name)) return toast('같은 닉네임이 이미 있어요');
  await db.ref(`rooms/${code}/players/${myId}`).set({ name, joinedAt: Date.now(), score: 0 });
  enterRoom(code);
}

function enterRoom(code){
  if(roomRef) roomRef.off();
  roomCode = code; store('lh_room', code); peek = false;
  roomRef = db.ref('rooms/'+code);
  roomRef.on('value', snap => {
    room = snap.val();
    if(!room){ leaveLocal(); toast('게임이 종료되었어요'); return; }
    if(!room.players || !room.players[myId]){ leaveLocal(); toast('방에서 나왔어요'); return; }
    hostAutoAdvance();
    render();
  });
}

function leaveLocal(){
  if(roomRef) roomRef.off();
  roomRef = null; room = null; roomCode = null; store('lh_room', null);
  history.replaceState(null, '', location.pathname);
  render();
}

async function leaveRoom(){
  if(isHost()){
    if(!confirm('호스트가 나가면 방이 닫혀요. 나갈까요?')) return;
    await db.ref('rooms/'+roomCode).remove();
  } else {
    if(!confirm('방에서 나갈까요?')) return;
    await db.ref(`rooms/${roomCode}/players/${myId}`).remove();
  }
}

/* ---------- 게임 진행 (호스트) ---------- */
function pickTopic(){
  const pool = BUILTIN_TOPICS.map(t => ({text:t[0],unit:t[1],min:t[2],max:t[3]})).concat(getCustom());
  const recent = room.recent || [];
  let cands = pool.filter(t => !recent.includes(t.text));
  if(!cands.length) cands = pool;
  return cands[Math.floor(Math.random()*cands.length)];
}

async function startGame(){
  const ids = Object.keys(players());
  if(ids.length < MIN_PLAYERS || ids.length > MAX_PLAYERS) return toast(`${MIN_PLAYERS}~${MAX_PLAYERS}명이 모여야 시작할 수 있어요`);
  const order = shuffle(ids);
  const roles = {};
  order.forEach((id, i) => roles[id] = i === 0 ? 'liar' : i === 1 ? 'troll' : 'audience');
  const t = pickTopic();
  const recent = [t.text].concat(room.recent || []).slice(0, 15);
  await roomRef.update({
    phase: 'input', round: (room.round || 0) + 1, recent,
    game: { topic: t.text, unit: t.unit || '', min: Number(t.min), max: Number(t.max), roles }
  });
}

function hostAutoAdvance(){
  if(!isHost() || room.phase !== 'input' || !room.game) return;
  const ids = Object.keys(room.game.roles || {}).filter(id => players()[id]);
  const nums = room.game.numbers || {};
  if(ids.length && ids.every(id => nums[id] !== undefined)) roomRef.update({ phase: 'discuss' });
}

async function forceDiscuss(){
  if(!confirm('아직 입력하지 않은 사람이 있어요. 그래도 주제를 공개할까요?')) return;
  await roomRef.update({ phase: 'discuss' });
}

async function revealRoles(){
  if(!confirm('지목을 마쳤나요? 모두의 역할을 공개합니다.')) return;
  await roomRef.update({ phase: 'reveal' });
}

async function chooseAccused(pid){
  const role = room.game.roles[pid];
  if(!confirm(`가장 많이 지목된 사람이 "${nameOf(pid)}" 님이 맞나요?`)) return;
  const winner = role === 'liar' ? 'audience' : role === 'troll' ? 'liar_troll' : 'liar';
  const upd = { phase: 'result', 'game/accused': pid, 'game/winner': winner };
  Object.entries(room.game.roles).forEach(([id, r]) => {
    if(!players()[id]) return;
    const won = winner === 'audience' ? r === 'audience' : winner === 'liar_troll' ? (r === 'liar' || r === 'troll') : r === 'liar';
    if(won) upd[`players/${id}/score`] = (players()[id].score || 0) + 1;
  });
  await roomRef.update(upd);
}

async function endGame(){
  if(!isHost()) return;
  if(!confirm('정말 게임을 종료할까요?\n모든 참가자가 처음 화면으로 돌아가고, 지금까지의 전적도 모두 사라져요.')) return;
  await db.ref('rooms/'+roomCode).remove();
}

async function toLobby(){ await roomRef.update({ phase: 'lobby', game: null }); }

async function submitNumber(){
  const g = room.game; const el = document.getElementById('numIn');
  const raw = (el.value || '').trim();
  const v = Number(raw);
  if(raw === '' || !Number.isInteger(v)) return toast('정수로 적어 주세요');
  if(v < g.min || v > g.max) return toast(`${g.min} ~ ${g.max} 사이의 숫자만 쓸 수 있어요`);
  await db.ref(`rooms/${roomCode}/game/numbers/${myId}`).set(v);
}

function render(){
  // 입력 중이던 내용과 커서를 보존
  const keep = {}; let focusId = null;
  $app.querySelectorAll('input[id]').forEach(i => keep[i.id] = i.value);
  if(document.activeElement && document.activeElement.id) focusId = document.activeElement.id;

  if(!configured) $app.innerHTML = viewSetup();
  else if(!room) $app.innerHTML = viewHome();
  else $app.innerHTML = viewTop() + ({lobby:viewLobby, input:viewInput, discuss:viewDiscuss, reveal:viewReveal, result:viewResult}[room.phase] || viewLobby)()
    + (isHost() && room.phase !== 'lobby' ? `<div class="foot"><button class="btn ghost small end" data-act="end">게임 종료</button></div>` : '');

  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if(el && !el.dataset.fresh) el.value = v; });
  if(focusId){ const el = document.getElementById(focusId); if(el) el.focus(); }
}

function inviteUrl(){
  return location.origin + location.pathname + '?room=' + roomCode + (room && room.joinToken ? '&t=' + room.joinToken : '');

let qrCache = {};
function qrBlock(){
  const url = inviteUrl();
  if(!qrCache[url] && window.QRCode){
    try{
      const tmp = document.createElement('div');
      new QRCode(tmp, { text: url, width: 360, height: 360, colorDark: '#111111', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
      const c = tmp.querySelector('canvas');
      qrCache[url] = c ? c.toDataURL() : (tmp.querySelector('img') || {}).src;
    }catch(e){}
  }
  return qrCache[url] ? `<div class="qr"><img src="${qrCache[url]}" alt="참가용 QR 코드"></div>` : '';
}

/* ---------- 이벤트 ---------- */
async function act(a, id){
  try{
    switch(a){
      case 'create': return await createRoom();
      case 'join': return await joinRoom();
      case 'joinInvite': { const q = new URLSearchParams(location.search); return await joinRoom(q.get('room'), q.get('t')); }
      case 'home': history.replaceState(null, '', location.pathname); return render();
      case 'start': return await startGame();
      case 'submit': return await submitNumber();
      case 'force': return await forceDiscuss();
      case 'reveal': return await revealRoles();
      case 'accuse': return await chooseAccused(id);
      case 'lobby': return await toLobby();
      case 'leave': return await leaveRoom();
      case 'end': return await endGame();
      case 'peek': peek = !peek; return render();
      case 'kick':
        if(confirm(`${nameOf(id)} 님을 내보낼까요?`)) await db.ref(`rooms/${roomCode}/players/${id}`).remove();
        return;
      case 'copy': {
        const url = inviteUrl();
        try{ await navigator.clipboard.writeText(url); toast('초대 링크를 복사했어요'); }
        catch(e){ prompt('이 링크를 복사해 보내세요', url); }
        return;
      }
      case 'addTopic': {
        const text = document.getElementById('tText').value.trim();
        const unit = document.getElementById('tUnit').value.trim();
        const min = Number(document.getElementById('tMin').value), max = Number(document.getElementById('tMax').value);
        const minRaw = document.getElementById('tMin').value, maxRaw = document.getElementById('tMax').value;
        if(!text) return toast('주제를 적어 주세요');
        if(minRaw === '' || maxRaw === '' || !Number.isInteger(min) || !Number.isInteger(max) || min >= max) return toast('최소·최대를 정수로, 최소 < 최대가 되게 적어 주세요');
        const list = getCustom(); list.push({text, unit, min, max}); setCustom(list);
        ['tText','tUnit','tMin','tMax'].forEach(k => document.getElementById(k).value = '');
        render(); document.querySelector('details.topics').open = true; toast('주제를 추가했어요');
        return;
      }
      case 'delTopic': {
        const list = getCustom(); list.splice(Number(id), 1); setCustom(list);
        render(); document.querySelector('details.topics').open = true; return;
      }
    }
  }catch(e){ console.error(e); toast('연결에 문제가 있어요. 잠시 후 다시 시도해 주세요'); }
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  act(b.dataset.act, b.dataset.id);
});
$app.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const id = e.target.id;
  if(id === 'numIn') act('submit');
  else if(id === 'codeIn') act('join');
});

render();
if(db){
  const saved = store('lh_room');
  if(saved){
    db.ref('rooms/'+saved).get().then(s => {
      if(s.exists() && s.val().players && s.val().players[myId]) enterRoom(saved);
      else store('lh_room', null);
    }).catch(()=>{});
  }
}
